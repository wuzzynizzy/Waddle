<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex">
<title>Waddle</title>
<link rel="icon" id="favicon" href="/-/icon.svg">
<link rel="preload" href="/-/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=localStorage.getItem('waddle.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="/-/app.css?v={{v}}">
</head>
<body>
<header id="bar">
  <button id="home" class="ic" title="Home" aria-label="Home"><svg viewBox="14 6 180 188" aria-hidden="true"><path d="M62 180c0-8 8-14 18-14s18 6 18 14c0 4-3 6-8 6H70c-5 0-8-2-8-6zM102 180c0-8 8-14 18-14s18 6 18 14c0 4-3 6-8 6h-20c-5 0-8-2-8-6z" fill="#ff8a1f"/><path class="pen-body" d="M50 96c-17 13-27 35-24 57 1 8 8 10 12 3 7-11 13-23 22-33zM146 90c19-5 35-20 40-40 2-8-5-12-10-6-9 10-22 18-36 23zM100 16c-35 0-57 29-57 70v34c0 36 23 58 57 58s57-22 57-58V86c0-41-22-70-57-70z"/><path d="M100 60c-10-13-35-10-37 12-1 8 2 14 6 19-6 9-8 20-8 32 0 27 16 45 39 45s39-18 39-45c0-12-2-23-8-32 4-5 7-11 6-19-2-22-27-25-37-12z" fill="#fff"/><circle class="pen-body" cx="81" cy="77" r="7.500"/><circle class="pen-body" cx="119" cy="77" r="7.500"/><path d="M87 92c0-4 6-7 13-7s13 3 13 7c0 6-7 13-13 13s-13-7-13-13z" fill="#ff8a1f"/></svg></button>
  <button id="back" class="ic nav" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="fwd" class="ic nav" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button id="reload" class="ic nav" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.340-5.660M20 4v5h-5"/></svg></button>
  <form id="nav" class="nav"><span id="lock" aria-hidden="true"></span><input id="addr" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search or enter address" aria-label="Address"></form>
  <span class="grow"></span>
  <button id="route" class="pill" title="Route" aria-label="Route"><i class="dot"></i><span></span></button>
  <button id="rotate" class="ic nav" title="New exit" aria-label="New exit"><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></button>
  <button id="fresh" class="ic" title="New identity" aria-label="New identity"><svg viewBox="0 0 24 24"><path d="M12 3l2.200 5.300L20 9l-4.300 3.900L17 19l-5-3-5 3 1.300-6.100L4 9l5.800-.700z"/></svg></button>
  <button id="gear" class="ic" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
</header>
<div id="progress"></div>
<main id="stage">
  <section id="landing">
    <div class="hero"><svg viewBox="0 0 200 200" role="img" aria-label="A penguin waving"><ellipse cx="100" cy="187" rx="56" ry="5" fill="currentColor" opacity=".07"/><path d="M62 180c0-8 8-14 18-14s18 6 18 14c0 4-3 6-8 6H70c-5 0-8-2-8-6zM102 180c0-8 8-14 18-14s18 6 18 14c0 4-3 6-8 6h-20c-5 0-8-2-8-6z" fill="#ff8a1f"/><path class="pen-body" d="M50 96c-17 13-27 35-24 57 1 8 8 10 12 3 7-11 13-23 22-33z"/><path class="pen-body wave" d="M146 90c19-5 35-20 40-40 2-8-5-12-10-6-9 10-22 18-36 23z"/><path class="pen-body" d="M100 16c-35 0-57 29-57 70v34c0 36 23 58 57 58s57-22 57-58V86c0-41-22-70-57-70z"/><path d="M100 60c-10-13-35-10-37 12-1 8 2 14 6 19-6 9-8 20-8 32 0 27 16 45 39 45s39-18 39-45c0-12-2-23-8-32 4-5 7-11 6-19-2-22-27-25-37-12z" fill="#fff"/><circle class="pen-body" cx="81" cy="77" r="7.500"/><circle class="pen-body" cx="119" cy="77" r="7.500"/><circle cx="83.600" cy="74.400" r="2.400" fill="#fff"/><circle cx="121.600" cy="74.400" r="2.400" fill="#fff"/><path d="M87 92c0-4 6-7 13-7s13 3 13 7c0 6-7 13-13 13s-13-7-13-13z" fill="#ff8a1f"/><path d="M90 93c3 2 6 3 10 3s7-1 10-3" fill="none" stroke="#d96a0b" stroke-width="2" stroke-linecap="round"/><ellipse cx="68" cy="93" rx="5.500" ry="3.200" fill="#ffd2b0"/><ellipse cx="132" cy="93" rx="5.500" ry="3.200" fill="#ffd2b0"/></svg></div>
    <h1>Waddle</h1>
    <form id="start"><input id="q" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search or enter address" aria-label="Search or enter address" autofocus></form>
    <div id="links"></div>
    <div id="chips"></div>
  </section>
  <div id="fit"><iframe id="frame" title="Page" allow="fullscreen; autoplay; clipboard-read; clipboard-write; encrypted-media; picture-in-picture"></iframe></div>
</main>
<aside id="drawer" hidden aria-label="Settings">
  <nav id="tabs"></nav>
  <div id="panel"></div>
</aside>
<div id="away" class="pill" role="status" hidden><i class="dot busy"></i><span>Reconnecting</span></div>
<div id="toast" role="status" hidden></div>
<script src="/-/app.js?v={{v}}"></script>
</body>
</html>
