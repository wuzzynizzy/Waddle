<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex">
<title>Waddle</title>
<link rel="icon" id="favicon" href="/-/icon.svg">
<link rel="preload" href="/-/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var p=JSON.parse(localStorage.getItem('waddle.frontend.v1')||'{}'),t=p.theme||localStorage.getItem('waddle.theme');if(['light','dark','midnight','forest','rose','sand'].indexOf(t)>=0)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="/-/app.css?v={{v}}">
</head>
<body>
<header id="bar">
  <button id="home" class="ic" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-6h-4v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button id="back" class="ic nav" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="fwd" class="ic nav" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button id="reload" class="ic nav" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.340-5.660M20 4v5h-5"/></svg></button>
  <form id="nav" class="nav"><span id="lock" aria-hidden="true"></span><input id="addr" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search or enter address" aria-label="Address"><div id="addressSuggestions" role="listbox" aria-label="Address suggestions" hidden></div></form>
  <span class="grow"></span>
  <button id="route" class="pill" title="Route" aria-label="Route"><i class="dot"></i><span></span></button>
  <button id="rotate" class="ic nav" title="New exit" aria-label="New exit"><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></button>
  <button id="bookmark" class="ic" title="Bookmark this page" aria-label="Bookmark this page" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4z"/></svg></button>
  <button id="library" class="ic" title="Bookmarks, saved pages, history and inspect" aria-label="Open library" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H20v17H6.5A1.5 1.5 0 0 0 5 21.5zM5 4.5v17M8 7h8M8 10h8"/></svg></button>
  <button id="fresh" class="ic" title="New identity" aria-label="New identity" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3 1.8 5.3L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.7L12 3zM19 14v6m3-3h-6M5 3v4M7 5H3"/></svg></button>
  <button id="gear" class="ic" title="Settings" aria-label="Settings" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
</header>
<nav id="tabbar" role="tablist" aria-label="Open tabs"></nav>
<div id="progress"></div>
<main id="stage" role="tabpanel">
  <section id="landing" aria-label="Start browsing">
    <div id="homeContent">
      <div class="home-main">
        <div class="home-search">
          <div id="searchBox">
            <form id="start">
              <input id="q" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search or enter an address" aria-label="Search or enter an address" autofocus>
            </form>
            <div id="suggestions" role="listbox" aria-label="Suggestions" hidden></div>
          </div>
        </div>
      </div>
      <footer class="home-footer">
        <a href="https://github.com/wuzzynizzy/Waddle" target="_blank" rel="noopener noreferrer">Source on GitHub</a>
      </footer>
    </div>
  </section>
  <div id="fit"><iframe id="frame" title="Page" allow="fullscreen; autoplay; clipboard-read; clipboard-write; encrypted-media; picture-in-picture"></iframe></div>
</main>
<aside id="drawer" hidden aria-label="Settings">
  <nav id="tabs"></nav>
  <div id="panel"></div>
</aside>
<aside id="libraryPanel" hidden aria-label="Bookmarks, saved pages, history and inspect">
  <div id="libraryHead"><strong>Library</strong><button id="libraryClose" class="ic" aria-label="Close library" title="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <nav id="libraryTabs" role="tablist"></nav>
  <div id="libraryContent"></div>
</aside>
<div id="away" class="pill" role="status" hidden><i class="dot busy"></i><span>Reconnecting</span></div>
<div id="toast" role="status" hidden></div>
<script src="/-/local.js?v={{v}}"></script>
<script src="/-/app.js?v={{v}}"></script>
</body>
</html>
